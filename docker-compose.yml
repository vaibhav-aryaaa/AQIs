services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartaqi_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///smartaqi.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - backend_data:/app
    networks:
      - smartaqi_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartaqi_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - smartaqi_net

volumes:
  backend_data:

networks:
  smartaqi_net:
    driver: bridge

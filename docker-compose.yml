services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartaqi_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///smartaqi.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - backend_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - smartaqi_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartaqi_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartaqi_net

volumes:
  backend_data:

networks:
  smartaqi_net:
    driver: bridge
